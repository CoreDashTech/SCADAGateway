async function open_(pw,quiet){const raw=Uint8Array.from(atob(D),c=>c.charCodeAt(0)),salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 try{const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct));try{sessionStorage.setItem('cd_lab_k',pw)}catch(_){}
  document.open();document.write(html);document.close()}catch(_){if(!quiet){e.textContent='รหัสไม่ถูกต้อง ลองใหม่อีกครั้ง';b.disabled=false;b.textContent='เปิดดู'}else{try{sessionStorage.removeItem('cd_lab_k')}catch(_){}}}}
