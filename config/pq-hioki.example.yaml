# CoreDash Nexus — Hioki PW3198 power-quality analysers on the LAN (add this "pq:" block to your site YAML).
#
# Wiring (no USB, no SD-card swapping):
#   PW3198 #2 MAIN GRID ─┐
#   PW3198 #3 LOAD ──────┼── LAN switch ── CoreDash Gateway (mini-PC / Raspberry Pi) ── Wi-Fi / 4G ── phones, tablets, PCs
#   PW3198 #6 APF ───────┘
#
# On each analyser: SYSTEM → Interface → LAN: set a fixed IP, subnet mask and gateway; set a 4-character web password (Password Setting page)
# so nobody else on the LAN can press START/RESET on the remote screen. Recording carries on while the gateway reads.
#
#   live values   → TCP port 3198 text commands — every pollMs
#   recorded data → Hioki PQ ONE over LAN (PW3198 has no FTP) → Export CSV → import in the app
#   remote screen → http://<ip>/  (the analyser's own HTTP server; open from a device on the same LAN)
#
# Live values use the PW3198 preset (verified on a real PW3198, firmware 1.08): TCP port 3198,
#   ":HEADer ON" + ":MEASure:ITEM:POWer 159,255,255" once per connection, then ":MEASure?" every pollMs.
# Leave "queries" out to use the preset. PW3198 has no FTP server — recorded files come from PQ ONE (LAN download).
pq:
  instruments:
    - id: PQ-MAIN
      no: 2
      role: grid
      name: MAIN GRID
      host: 192.168.1.62
      model: PW3198
      commandPort: 3198
      pollMs: 1000
    - id: PQ-LOAD
      no: 3
      role: load
      name: LOAD
      host: 192.168.1.63          # second analyser, if you have one
      model: PW3198
    - id: PQ-APF
      no: 6
      role: apf
      name: APF
      host: 192.168.1.66          # third analyser, if you have one
      model: PW3198
    # Panel meters over Modbus give the same live record (profiles in app/pq-meters.js):
    #   eastron-sdm630 | schneider-pm5560 | siemens-pac3200 | janitza-umg96rm — or "registers: [[U1RMS, 0], [PSUM, 52, 1000], …]"
    # - id: PQ-LOAD
    #   no: 3
    #   name: LOAD
    #   driver: modbus
    #   profile: schneider-pm5560
    #   host: 192.168.1.70        # Modbus TCP (port 502) — or path: COM3 / /dev/ttyUSB0 + baudRate + parity for RS-485
    #   unitId: 1
    #   pollMs: 1000
  # Power-quality alarms (app/pq-alarms.js): harmonics, HF noise, spikes, dips, swells, interruptions, unbalance,
  # frequency, PF, neutral current, K-factor, lost connection. Udin = nominal phase voltage on the analyser.
  unom: 230
  notify: [phone]        # channel ids from the top-level "notify:" block; alarms always, "watch" level only with pushWarn
  pushWarn: false

# top-level (outside "pq:") — phone push through the free ntfy app (Android/iOS): subscribe to the same secret topic
# notify:
#   phone: { type: ntfy, topic: coredash-CHANGE-ME-to-a-long-random-name, server: https://ntfy.sh }
