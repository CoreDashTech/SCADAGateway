# CoreDash Nexus — water-meter test bench: I/O list for the real bench PLC (example)
# Developed by CoreDash Technology
#
# Copy the device + tags below into your site file (config/plant-a.yaml) when the bench PLC is wired.
# Method: volumetric (standing start/stop) per ISO 4064-2 / OIML R 49-2, two proving tanks:
#   TK-20  : 20 L tank, graduated neck at 10 L  (Q1, Q2 test volumes)
#   TK-200 : 200 L tank, graduated necks at 100 L and 200 L (Q3, Q4 test volumes)
# Volume point sensors sit in the MIDDLE OF EACH NARROW NECK: a Ø50 mm neck holds 1.96 mL/mm,
# a Ø650 mm body 332 mL/mm, so ±1 mm sensor repeatability = ±0.002 L in the neck vs ±0.33 L in the body.

devices:
  - id: BENCH-PLC
    name: { th: "PLC แท่นทดสอบมาตร", en: "Meter test bench PLC" }
    driver: modbus-tcp
    host: 192.168.20.10
    port: 502
    unitId: 1
    pollMs: 100            # fast poll: point sensors and valve feedback
    timeoutMs: 500

tags:
  # ---- valves (coil = command, discrete = limit-switch feedback) -------------------------------
  - { id: XV-IN.CMD,  device: BENCH-PLC, type: coil,     address: 0,  dataType: bool, writable: true, minRole: engineer }
  - { id: XV-S.CMD,   device: BENCH-PLC, type: coil,     address: 1,  dataType: bool, writable: true, minRole: engineer }   # fast-acting ≤ 0.5 s, at the TK-20 inlet
  - { id: XV-L.CMD,   device: BENCH-PLC, type: coil,     address: 2,  dataType: bool, writable: true, minRole: engineer }   # fast-acting ≤ 0.5 s, at the TK-200 inlet
  - { id: XV-DS.CMD,  device: BENCH-PLC, type: coil,     address: 3,  dataType: bool, writable: true, minRole: engineer }
  - { id: XV-DL.CMD,  device: BENCH-PLC, type: coil,     address: 4,  dataType: bool, writable: true, minRole: engineer }
  - { id: PU-01.RUN,  device: BENCH-PLC, type: coil,     address: 5,  dataType: bool, writable: true, minRole: engineer }
  - { id: XV-S.ZSC,   device: BENCH-PLC, type: discrete, address: 10, dataType: bool }   # closed limit switch
  - { id: XV-L.ZSC,   device: BENCH-PLC, type: discrete, address: 11, dataType: bool }

  # ---- level sensors -------------------------------------------------------------------------
  - { id: LSL-S,   device: BENCH-PLC, type: discrete, address: 0, dataType: bool }   # TK-20 bottom: empty / zero
  - { id: LS-10,   device: BENCH-PLC, type: discrete, address: 1, dataType: bool }   # TK-20 neck @ 10.00 L → stop
  - { id: LSHH-S,  device: BENCH-PLC, type: discrete, address: 2, dataType: bool }   # TK-20 overflow (hard-wired trip too)
  - { id: LSL-L,   device: BENCH-PLC, type: discrete, address: 3, dataType: bool }   # TK-200 bottom: empty / zero
  - { id: LS-100,  device: BENCH-PLC, type: discrete, address: 4, dataType: bool }   # TK-200 lower neck @ 100.0 L → stop
  - { id: LS-200,  device: BENCH-PLC, type: discrete, address: 5, dataType: bool }   # TK-200 upper neck @ 200.0 L → stop
  - { id: LSHH-L,  device: BENCH-PLC, type: discrete, address: 6, dataType: bool }   # TK-200 overflow (hard-wired trip too)
  - { id: LT-01.L, device: BENCH-PLC, type: input,    address: 0, dataType: float32, unit: L }       # radar on TK-200, continuous volume

  # ---- flow, pressure, temperature ------------------------------------------------------------
  - { id: FT-01.Q,   device: BENCH-PLC, type: input,   address: 10, dataType: float32, unit: L/h }  # reference magflow after the meters
  - { id: FCV-01.SP, device: BENCH-PLC, type: holding, address: 0,  dataType: float32, unit: L/h, writable: true, minRole: engineer, min: 0, max: 4000 }  # PID setpoint
  - { id: PT-01.P,   device: BENCH-PLC, type: input,   address: 12, dataType: float32, unit: bar }  # before meters
  - { id: PT-02.P,   device: BENCH-PLC, type: input,   address: 14, dataType: float32, unit: bar }  # after meters (pressure loss ≤ 0.63 bar at Q3)
  - { id: TT-01.T,   device: BENCH-PLC, type: input,   address: 16, dataType: float32, unit: "°C" } # PT100 before the tanks

  # ---- meters under test: pulse outputs counted by PLC high-speed counters ---------------------
  # Mechanical meters without pulse output: read the register by camera/OCR or let the operator type it.
  - { id: M1.VOL, device: BENCH-PLC, type: input, address: 20, dataType: uint32, scale: 0.01, unit: L, name: { th: "SMCV4", en: "SMCV4" } }
  - { id: M2.VOL, device: BENCH-PLC, type: input, address: 22, dataType: uint32, scale: 0.01, unit: L, name: { th: "GMCV3-V3.5", en: "GMCV3-V3.5" } }
  - { id: M3.VOL, device: BENCH-PLC, type: input, address: 24, dataType: uint32, scale: 0.01, unit: L, name: { th: "ASAHI GMK", en: "ASAHI GMK" } }

interlocks:
  # Overflow: close both tank inlet valves and stop the pump, in every mode
  - { id: IL_TK20_HH,  when: { tag: LSHH-S, op: "==", value: true }, force: { tag: XV-S.CMD, value: false } }
  - { id: IL_TK200_HH, when: { tag: LSHH-L, op: "==", value: true }, force: { tag: XV-L.CMD, value: false } }
  - { id: IL_PUMP_HH,  when: { tag: LSHH-L, op: "==", value: true }, force: { tag: PU-01.RUN, value: false } }
  # The stop at LS-10 / LS-100 / LS-200 runs INSIDE the PLC (scan ≤ 10 ms), not over the network,
  # so the valve closes at the same level every run. The app only reads the result.
